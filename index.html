<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A joke</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#f2f2f2;font-family:system-ui,-apple-system,sans-serif}
.card{max-width:520px;margin:24px;padding:32px;border-radius:16px;background:#1a1d24;box-shadow:0 10px 40px #0008;text-align:center}
p{font-size:1.2rem;line-height:1.6}button{margin-top:16px;padding:14px 28px;font-size:1rem;border:0;border-radius:999px;background:#ff4d8d;color:#fff;cursor:pointer}
#punch{display:none;font-weight:600;color:#ffd166}</style></head><body><div class="card">
<p>A bloke goes to the doctor and says, "Doc, every time I sneeze I have an orgasm."</p>
<p id="punch">Doctor says, "What are you taking for it?" He says, "Pepper."</p>
<button id="b" onclick="document.getElementById('punch').style.display='block';this.style.display='none'">Reveal punchline</button>
</div></body></html>
